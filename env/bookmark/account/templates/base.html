<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Bookmarks
        {% endblock %}
    </title>

</head>

<body>

    <header>

        <nav>

            <a href="/">
                Bookmarks
            </a>

            {% if request.user.is_authenticated %}

                <a href="{% url 'account:dashboard' %}">
                    Dashboard
                </a>

                <form
                    method="post"
                    action="{% url 'account:logout' %}"
                    style="display: inline;">

                    {% csrf_token %}

                    <button type="submit">
                        Logout
                    </button>

                </form>

            {% else %}

                <a href="{% url 'account:login' %}">
                    Login
                </a>

            {% endif %}

        </nav>

    </header>


    <main>
        {% if messages %}

    <ul class="messages">

        {% for message in messages %}

            <li class="{{ message.tags }}">
                {{ message|safe }}

                <a href="#" class="close">
                    x
                </a>
            </li>

        {% endfor %}

    </ul>

{% endif %}
        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
