{% extends "base.html" %}

{% block title %}Edit Profile | Bookmarks{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>👤 Edit Profile</h1>
        <p class="form-card-subtitle">Update your personal details and avatar photo.</p>

        <form method="post" enctype="multipart/form-data">
            {{ user_form.as_p }}
            {{ profile_form.as_p }}
            {% csrf_token %}

            <div class="form-actions">
                <input type="submit" value="💾 Save Changes" class="button">
            </div>
        </form>
    </div>
{% endblock %}
