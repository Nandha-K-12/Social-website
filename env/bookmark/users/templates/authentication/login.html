{% extends "base.html" %}

{% block title %}
    Log-in
{% endblock %}

{% block content %}

    <h1>Log-in</h1>

    <form method="post">

        {{ form.as_p }}

        {% csrf_token %}

        <input
            type="submit"
            value="Log-in">

    </form>
    <p>
        <a href="{% url 'users:password_reset' %}">
            Forgot your password?
        </a>
    </p>

{% endblock %}
