{% extends "base.html" %}

{% block title %}Log In | Bookmarks{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>🔐 Log In</h1>
        <p class="form-card-subtitle">Welcome back! Please enter your details.</p>

        <form method="post">
            {{ form.as_p }}
            {% csrf_token %}

            <div class="form-actions">
                <input type="submit" value="Log In" class="button">
            </div>
        </form>

        <div class="auth-footer">
            <p>
                <a href="{% url 'users:password_reset' %}">Forgot your password?</a>
            </p>
        </div>
    </div>
{% endblock %}
