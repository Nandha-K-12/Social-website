{% extends "base.html" %}

{% block title %}Change Password | Bookmarks{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>🔒 Change Password</h1>
        <p class="form-card-subtitle">Use the form below to update your password.</p>

        <form method="post">
            {{ form.as_p }}
            {% csrf_token %}

            <div class="form-actions">
                <input type="submit" value="Change Password" class="button">
            </div>
        </form>
    </div>
{% endblock %}
