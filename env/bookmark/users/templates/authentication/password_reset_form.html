{% extends "base.html" %}

{% block title %}Reset Password | Bookmarks{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>🔑 Reset Password</h1>
        <p class="form-card-subtitle">Enter your registered email address to receive reset instructions.</p>

        <form method="post">
            {{ form.as_p }}
            {% csrf_token %}

            <div class="form-actions">
                <input type="submit" value="Send Reset Instructions" class="button">
            </div>
        </form>
        
        <div class="auth-footer">
            <p>
                Remembered your password?
                <a href="{% url 'users:login' %}"><strong>Log in</strong></a>
            </p>
        </div>
    </div>
{% endblock %}
